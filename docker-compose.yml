# Ponto de partida OPCIONAL. Usar Docker é um desejável, não uma obrigação.
# O mock-service e um banco já estão prontos. Se quiser, complete com os SEUS
# serviços: "api" (NestJS) e "web" (React).

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    # 5433 no host: a 5432 costuma já estar ocupada por outro Postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d checkin"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      CADASTRO_URL: http://mock-service:4000
      DATABASE_URL: postgres://desafio:desafio@db:5432/checkin
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mock-service:
        condition: service_started

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
